# Stages this n8n community node package on npm on every version tag push.
# A staged version goes live only after a maintainer approves it with 2FA.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# The runner's npm needs the `stage` command (npm 11.19.0, which Node's lts/*
# brought in October 2026, has it). `n8n-node release` isn't used here: in CI it
# runs a plain `npm publish`, which neither option below allows.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# This repository uses Option B for now. Option A is set up as well, but npm
# refuses the login: its registry answers "package not found" to the immutable
# OIDC subject claims that GitHub gives every repository created after
# 2026-07-15 (https://github.com/npm/cli/issues/9969). Once npm accepts them,
# delete the NPM_TOKEN secret and the trusted publisher takes over.
#
# Option A — OIDC Trusted Publishing (preferred, no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Under "Allowed actions", leave "Allow npm publish" unchecked, so this
#      workflow can only stage versions.
#   5. Leave the NPM_TOKEN secret unset in this repository. GitHub's OIDC
#      token is used instead — no secret ever touches your repo settings.
#
# Option B — npm access token that can only stage:
#   1. On npmjs.com: Access Tokens → Generate New Token. Leave "Bypass
#      two-factor authentication" unchecked, choose the permission "Read and
#      write (stage only)" and limit the token to this package.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret.
#      Name it NPM_TOKEN and paste the token value. Replace it when the token
#      expires.
#
# Both options work with --provenance. Provenance is signed by GitHub's OIDC
# infrastructure regardless of how npm authentication is handled.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Write the changes under "## [Unreleased]" in CHANGELOG.md, then run the
# following command locally to start an interactive release:
#
#   npm run release
#
# This runs release-it (config in .release-it.json): it will lint, test, build,
# prompt for a version bump, turn the Unreleased section into the new version,
# commit, tag, and push — which triggers this workflow to stage the version on
# npm. Then approve it on npmjs.com (package → staged versions) or with
#
#   npm stage list n8n-nodes-fashion-cloud
#   npm stage approve <stage-id>
#
# Approving asks for 2FA and publishes the version with its provenance.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      # Actions are pinned to commits: a tag can be moved to different code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run tests
        run: 'npm test'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Stage on npm
        id: stage
        # Stages the version with a provenance attestation (requires id-token: write above).
        # It isn't public until a maintainer approves it (see RELEASE PROCESS).
        # RELEASE_MODE lets the prepublishOnly guard (`n8n-node prerelease`) pass.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — the token step is skipped and
        #   npm uses the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets — it is written to
        #   .npmrc here before staging.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm stage publish --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'

      - name: Show why npm refused the login
        # With Option A, npm swaps this run's GitHub identity (an OIDC token) for
        # a short-lived npm token. When npm refuses, `npm stage publish` only
        # reports ENEEDAUTH ("requires you to be logged in"); the reason is in
        # npm's debug log. The claims are what npm compares with the package's
        # trusted publisher (`npm trust list n8n-nodes-fashion-cloud`).
        # The token itself is never printed, only these claims.
        if: failure() && steps.stage.conclusion == 'failure'
        run: |
          echo 'npm debug log:'
          # The newest log is the one of the staging attempt above
          grep -h -i 'oidc' "$(ls -t ~/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1)" 2>/dev/null || echo 'no OIDC lines'
          echo 'GitHub identity of this run:'
          node -e '
            const { ACTIONS_ID_TOKEN_REQUEST_URL: url, ACTIONS_ID_TOKEN_REQUEST_TOKEN: bearer } = process.env;
            if (!url) {
              console.log("no OIDC token available (id-token: write missing?)");
              process.exit(0);
            }
            fetch(`${url}&audience=npm:registry.npmjs.org`, { headers: { Authorization: `Bearer ${bearer}` } })
              .then((response) => response.json())
              .then(({ value }) => {
                const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url"));
                const names = ["sub", "repository", "repository_visibility", "workflow_ref", "ref", "environment", "runner_environment"];
                for (const name of names) console.log(`${name}: ${claims[name] ?? "(not set)"}`);
              })
              .catch((error) => console.log(`could not read the OIDC token: ${error.message}`));
          '
