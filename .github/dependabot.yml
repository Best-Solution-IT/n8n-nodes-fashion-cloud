# Keeps the GitHub Actions in .github/workflows current. They are pinned to
# commit SHAs; Dependabot updates the SHA and the version comment next to it.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Only propose versions that have been out for a week, so a compromised
    # release has time to be noticed before it reaches the publish workflow
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
